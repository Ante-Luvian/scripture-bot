[pytest]
testpaths = tests
addopts = -m "not live and not corpus and not stress"
markers =
    live: hits real external services (run with: python -m pytest -m live)
    corpus: scans every corpus file, several minutes (run with: python -m pytest -m corpus)
    stress: every command fed hostile input, a few minutes (run with: python -m pytest -m stress)
filterwarnings =
    ignore::DeprecationWarning:discord.*
